name = "mutbot-edge"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Pendientes de alta (texto cifrado, vencen a los 7 días). Antes del primer deploy:
#   bunx wrangler kv namespace create ALTAS
# y pegar abajo el `id` que imprime.
[[kv_namespaces]]
binding = "ALTAS"
id = "64b375a970e847a2b906a63fe5ecb4fe"

[vars]
UPSTREAM_HOST = "mu.mormon.garden"
ALLOWED_HOSTS = "mu.mormon.garden,clasico"
SLOW_UPSTREAM_HOST = "slow.mu.garden"

# Secretos (no van acá): PUBLIC_KEY, ALTA_TOKEN, STATION_TOKEN, PROXY_TOKEN. Ver workers/alta/README.md.
