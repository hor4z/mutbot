# ClickHouse local para los datos del bot (solo 127.0.0.1; datos en ~/.mubot/clickhouse).
# Credenciales en ../.env.db (no se commitea): MUBOT_DB_USER / MUBOT_DB_PASSWORD.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: mubot-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: mubot
      CLICKHOUSE_USER: ${MUBOT_DB_USER:-mubot}
      CLICKHOUSE_PASSWORD: ${MUBOT_DB_PASSWORD:?falta MUBOT_DB_PASSWORD en .env.db}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - ${HOME}/.mubot/clickhouse:/var/lib/clickhouse
      - ./config.d/mubot.xml:/etc/clickhouse-server/config.d/mubot.xml:ro
    # Logs del contenedor con tope (3 × 10 MB).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
